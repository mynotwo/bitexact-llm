name: CPU reproduction checks
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU runtime and declared test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' ruff
      - name: Lint reproduction and bound changes
        run: >-
          ruff check src/bitexact/repro.py examples/check_bit_identity.py
          src/bitexact/exact/model.py src/bitexact/exact/segs.py src/bitexact/exact/wmm.py
          tests/test_repro.py tests/test_model_bounds.py
      - name: Run tests (model and CUDA cases explicitly skip without their prerequisites)
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Record weight-free arithmetic checks
        run: python -m bitexact.repro self-check --out arithmetic-linux-py${{ matrix.python }}.json
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install and exercise the wheel outside the source checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m bitexact.repro self-check --out "$GITHUB_WORKSPACE/arithmetic-wheel-py${{ matrix.python }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-reproduction-py${{ matrix.python }}
          path: |
            arithmetic-linux-py${{ matrix.python }}.json
            arithmetic-wheel-py${{ matrix.python }}.json
            test-results.xml
            dist/*.whl
          if-no-files-found: error
