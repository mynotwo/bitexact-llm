name: CPU reproduction checks
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU runtime and declared test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' ruff
      - name: Lint, test, self-check and wheel (model and CUDA cases explicitly skip without their prerequisites)
        run: bash scripts/check.sh .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-reproduction-py${{ matrix.python }}
          path: |
            arithmetic-linux-py${{ matrix.python }}.json
            arithmetic-wheel-py${{ matrix.python }}.json
            test-results.xml
            dist/*.whl
          if-no-files-found: error
